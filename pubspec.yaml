name: mrz_scanner_plus
description: "A new Flutter plugin When scanning and photographing a document, only the document image within the mask will be returned."
version: 0.1.7
homepage: https://github.com/fastcode555/mrz_scanner_plus.git

environment:
  sdk: ^3.5.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

